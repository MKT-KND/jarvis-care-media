name: JARVIS Auto Daily Update

on:
  schedule:
    - cron: '0 21 * * *' # 毎日日本時間あさ6時に自動実行
  workflow_dispatch: # 手動実行用

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Generate Content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import google.generativeai as genai

          # --- 1. A8.netの広告コードをここに貼り付けます ---
          # 以下の中身をご自身のA8.net広告コードに書き換えてください。
          ad_code = """
          ここにA8.netでコピーした広告コードを貼り付け
          """
          # --------------------------------------------------

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          prompt = "医療・介護・福祉に役立つ簡単なケアアドバイスを1つ作成してください。HTMLのタグ（<h3>と<p>）を使って出力してください。"

          try:
              response = model.generate_content(prompt)
              ai_text = response.text
          except Exception as e:
              ai_text = f"<h3>本日のケアガイド</h3><p>現在AIコンテンツを準備中です。（エラー詳細: {e}）</p>"

          html_code = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>医療・介護・福祉の暮らし知恵袋</title>
              <style>
                  body {{ font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 15px; color: #333; }}
                  header {{ background: #2c7a7b; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }}
                  h1 {{ margin: 0; font-size: 1.3rem; }}
                  .card {{ background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }}
                  .ad-box {{ background: #edf2f7; border: 2px dashed #cbd5e0; padding: 15px; text-align: center; border-radius: 8px; font-size: 0.9rem; margin-top: 15px; overflow-x: auto; }}
              </style>
          </head>
          <body>
              <header>
                  <h1>医療・介護・福祉の暮らし知恵袋</h1>
              </header>
              <div class="card">
                  {ai_text}
              </div>
              <div class="card">
                  <div style="font-weight:bold; margin-bottom:10px; text-align:center;">💡 おすすめ福祉・介護サービス</div>
                  <div class="ad-box">
                      {ad_code}
                  </div>
              </div>
          </body>
          </html>"""

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html_code)
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "JARVIS-AI"
          git config --global user.email "jarvis@example.com"
          git add index.html
          git commit -m "JARVIS: Auto update content" || exit 0
          git push
